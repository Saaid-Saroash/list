<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover" />
  <title>Shopping List</title>
  <style>
    :root {
      --font-scale: 1;
      --tile-scale: 1;
      --panel-h: 92px;
      --radius-xl: 26px;
      --radius-lg: 18px;
      --radius-md: 14px;
      --shadow: 0 16px 40px rgba(0,0,0,.26);
      --glass-blur: blur(14px) saturate(160%);
      --accent: #68e8ff;
      --accent2: #9b7bff;
      --success: #35d07f;
      --danger: #ff6d7d;
      --line: rgba(255,255,255,.10);
      --surface: rgba(17, 23, 34, .58);
      --surface-2: rgba(255,255,255,.05);
      --text: #e9eef7;
      --muted: #a0aec3;
      --bg0: #050a11;
      --bg1: #08101a;
      --grid: rgba(255,255,255,.03);
      --panel-border: rgba(255,255,255,.10);
      --item-bg: linear-gradient(180deg, rgba(255,255,255,.08), rgba(255,255,255,.03));
      --item-bg-hover: rgba(104,232,255,.06);
      --panel-grad: linear-gradient(180deg, rgba(21,29,43,.76), rgba(13,18,28,.58));
      --shell-grad: linear-gradient(180deg, rgba(21,29,43,.48), rgba(11,17,27,.36));
      --btn-text-dark: #03121a;
      --btn-text-warm: #1a0f05;
      --chip-bg: rgba(8,12,18,.72);
      --switch-off: rgba(255,255,255,.12);
      --switch-knob: #e5edf8;
      --done-chip: rgba(53,208,127,.18);
    }

    body[data-theme="dark"] {
      color-scheme: dark;
    }

    body[data-theme="light"] {
      color-scheme: light;
      --bg0: #ffffff;
      --bg1: #f4f6f9;
      --surface: rgba(255,255,255,.96);
      --surface-2: rgba(255,255,255,.84);
      --text: #102235;
      --muted: #5a6b80;
      --line: rgba(16,34,53,.10);
      --grid: rgba(16,34,53,.04);
      --panel-border: rgba(16,34,53,.08);
      --item-bg: linear-gradient(180deg, rgba(255,255,255,.98), rgba(248,250,252,.96));
      --item-bg-hover: rgba(16,34,53,.04);
      --panel-grad: linear-gradient(180deg, rgba(255,255,255,.96), rgba(246,248,252,.92));
      --shell-grad: linear-gradient(180deg, rgba(255,255,255,.96), rgba(248,250,252,.94));
      --chip-bg: rgba(255,255,255,.96);
      --switch-off: rgba(16,34,53,.12);
      --switch-knob: #ffffff;
      --done-chip: rgba(53,208,127,.18);
      --btn-text-dark: #082132;
      --btn-text-warm: #2c1805;
    }

    [data-font="small"] { --font-scale: .94; }
    [data-font="medium"] { --font-scale: 1; }
    [data-font="large"] { --font-scale: 1.12; }
    [data-font="xl"] { --font-scale: 1.24; }

    * { box-sizing: border-box; }
    html, body { height: 100%; }
    html { scroll-behavior: auto; overscroll-behavior-y: none; }

    body {
      margin: 0;
      font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      font-size: calc(15px * var(--font-scale));
      color: var(--text);
      background:
        radial-gradient(circle at 10% 10%, rgba(104,232,255,.12), transparent 18%),
        radial-gradient(circle at 90% 8%, rgba(155,123,255,.10), transparent 18%),
        radial-gradient(circle at 50% 100%, rgba(53,208,127,.06), transparent 18%),
        linear-gradient(180deg, var(--bg1), var(--bg0));
      overflow-x: hidden;
      overflow-y: auto;
      overflow-anchor: none;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background:
        linear-gradient(var(--grid) 1px, transparent 1px),
        linear-gradient(90deg, var(--grid) 1px, transparent 1px);
      background-size: 54px 54px;
      opacity: .95;
      mask-image: linear-gradient(180deg, rgba(0,0,0,.35), transparent 86%);
    }

    .app {
      width: min(1100px, calc(100vw - 14px));
      margin: 0 auto;
      padding: 10px 0 28px;
    }

    .panel-wrap {
      width: min(780px, calc(100vw - 14px));
      margin: 0 auto;
      position: sticky;
      top: 10px;
      z-index: 20;
      transition: transform .24s ease, opacity .24s ease;
      will-change: transform, opacity;
    }
    .panel-wrap.hidden {
      transform: translateY(-140%);
      opacity: 0;
      pointer-events: none;
    }

    .panel {
      background: var(--panel-grad);
      border: 1px solid var(--panel-border);
      border-radius: var(--radius-xl);
      box-shadow: var(--shadow);
      backdrop-filter: var(--glass-blur);
      -webkit-backdrop-filter: var(--glass-blur);
      padding: 12px;
      overflow: hidden;
      contain: layout paint;
    }

    .toolbar {
      display: flex;
      gap: 8px;
      align-items: stretch;
      flex-wrap: nowrap;
      overflow-x: auto;
      overflow-y: hidden;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
      padding-bottom: 2px;
      touch-action: pan-x;
    }
    .toolbar::-webkit-scrollbar { display: none; }

    .input,
    .select,
    .toggle,
    .range-wrap,
    .chip {
      flex: 0 0 auto;
      border: 1px solid var(--line);
      background: var(--chip-bg);
      color: var(--text);
      border-radius: var(--radius-md);
      box-shadow: inset 0 1px 0 rgba(255,255,255,.03);
      min-height: 42px;
    }

    .input,
    .select {
      padding: 10px 12px;
      outline: none;
      font-size: .95em;
      transition: border-color .15s ease, box-shadow .15s ease;
      min-width: 150px;
    }
    .input { width: 220px; }
    .input:focus,
    .select:focus {
      border-color: rgba(104,232,255,.60);
      box-shadow: 0 0 0 3px rgba(104,232,255,.10);
    }

    .chip {
      border: none;
      cursor: pointer;
      user-select: none;
      padding: 10px 12px;
      font-weight: 700;
      font-size: .88em;
      white-space: nowrap;
      transition: transform .15s ease, filter .15s ease, opacity .15s ease;
    }
    .chip:hover { transform: translateY(-1px); }
    .chip:active { transform: translateY(1px); }

    .btn-add { background: linear-gradient(135deg, var(--accent), #b9f1ff); color: var(--btn-text-dark); }
    .btn-group { background: linear-gradient(135deg, #d2b7ff, #a78bfa); color: #100817; }
    .btn-clear { background: linear-gradient(135deg, #ffd166, #ff956b); color: var(--btn-text-warm); }
    .btn-theme { background: linear-gradient(135deg, rgba(255,255,255,.55), rgba(255,255,255,.34)); color: var(--btn-text-dark); }
    body[data-theme="dark"] .btn-theme { background: linear-gradient(135deg, rgba(255,255,255,.10), rgba(255,255,255,.06)); color: var(--text); }

    .toggle {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      min-width: 136px;
      padding: 10px 12px;
      cursor: pointer;
      user-select: none;
    }
    .toggle span { font-size: .88em; line-height: 1.1; }
    .toggle input { display: none; }
    .switch {
      width: 42px;
      height: 24px;
      border-radius: 999px;
      background: var(--switch-off);
      border: 1px solid rgba(255,255,255,.08);
      position: relative;
      flex: 0 0 auto;
      transition: .18s ease;
    }
    .switch::after {
      content: "";
      position: absolute;
      top: 3px;
      left: 3px;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: var(--switch-knob);
      transition: .18s ease;
      box-shadow: 0 8px 18px rgba(0,0,0,.15);
    }
    .toggle input:checked + .switch {
      background: var(--done-chip);
      border-color: rgba(53,208,127,.28);
    }
    .toggle input:checked + .switch::after { left: 22px; background: #7ef0a8; }

    .range-wrap {
      display: grid;
      gap: 6px;
      padding: 8px 12px 10px;
      min-width: 160px;
    }
    .range-label {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      color: var(--muted);
      font-size: .84em;
      user-select: none;
    }
    .range {
      width: 100%;
      accent-color: var(--accent);
    }

    .content {
      width: min(1100px, calc(100vw - 14px));
      margin: 14px auto 0;
      display: grid;
      gap: 12px;
    }

    .shell {
      background: var(--shell-grad);
      border: 1px solid var(--panel-border);
      border-radius: 22px;
      box-shadow: var(--shadow);
      overflow: hidden;
      backdrop-filter: var(--glass-blur);
      -webkit-backdrop-filter: var(--glass-blur);
      contain: layout paint;
    }

    .section-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 12px;
      border-bottom: 1px solid rgba(255,255,255,.06);
      background: rgba(255,255,255,.03);
    }

    .section-title {
      margin: 0;
      font-size: .92em;
      letter-spacing: .03em;
      color: rgba(233,238,247,.82);
      text-transform: uppercase;
      user-select: none;
    }

    .group-actions {
      display: flex;
      gap: 8px;
      align-items: center;
      flex: 0 0 auto;
    }

    .small-btn {
      border: 1px solid var(--line);
      background: rgba(255,255,255,.05);
      color: var(--text);
      border-radius: 11px;
      padding: 8px 10px;
      font-size: .80em;
      font-weight: 700;
      cursor: pointer;
      user-select: none;
    }

    .drop-zone { padding: 12px; }

    .list {
      margin: 0;
      padding: 0;
      list-style: none;
      display: grid;
      gap: 8px;
      min-height: 24px;
    }

    .done-title {
      margin: 10px 0 8px;
      padding: 0 12px;
      color: rgba(233,238,247,.72);
      font-size: .85em;
      letter-spacing: .04em;
      text-transform: uppercase;
      user-select: none;
    }

    .item {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr) auto;
      gap: 10px;
      align-items: center;
      padding: calc(12px * var(--tile-scale)) 12px;
      min-height: calc(56px * var(--tile-scale));
      background: var(--item-bg);
      border: 1px solid var(--panel-border);
      border-radius: 18px;
      overflow: hidden;
      touch-action: pan-y;
      will-change: transform, opacity;
      position: relative;
      contain: layout paint;
    }
    .item:hover { background: linear-gradient(180deg, rgba(255,255,255,.10), rgba(255,255,255,.05)); }
    body[data-theme="light"] .item:hover { background: var(--item-bg-hover); }

    .item.dragging { opacity: .62; transform: scale(.985); }

    .item.done .text {
      color: rgba(233,238,247,.58);
      text-decoration: line-through;
      text-decoration-thickness: 2px;
    }
    body[data-theme="light"] .item.done .text { color: rgba(16,34,53,.46); }

    .check-wrap {
      width: 22px;
      display: grid;
      place-items: center;
      flex: 0 0 auto;
    }

    .check {
      appearance: none;
      width: 22px;
      height: 22px;
      border-radius: 7px;
      border: 2px solid rgba(120,139,166,.96);
      background: rgba(7,10,15,.84);
      display: grid;
      place-items: center;
      cursor: pointer;
      margin: 0;
      transition: .15s ease;
    }
    body[data-theme="light"] .check { background: rgba(255,255,255,.85); border-color: rgba(16,34,53,.22); }
    .check::after {
      content: "";
      width: 10px;
      height: 5px;
      border-left: 3px solid transparent;
      border-bottom: 3px solid transparent;
      transform: rotate(-45deg) translateY(-1px);
    }
    .check:checked {
      border-color: rgba(53,208,127,.95);
      background: rgba(53,208,127,.16);
      box-shadow: 0 0 0 4px rgba(53,208,127,.08);
    }
    .check:checked::after {
      border-left-color: var(--success);
      border-bottom-color: var(--success);
    }

    .text {
      min-width: 0;
      line-height: 1.35;
      word-break: break-word;
      user-select: none;
    }

    .drag-handle {
      width: 36px;
      height: 36px;
      display: grid;
      place-items: center;
      border-radius: 12px;
      user-select: none;
      border: 1px solid var(--line);
      background: rgba(255,255,255,.05);
      color: #d6ddea;
      cursor: grab;
      font-size: 18px;
      line-height: 1;
      touch-action: none;
      flex: 0 0 auto;
    }
    body[data-theme="light"] .drag-handle { color: #334; background: rgba(255,255,255,.65); }
    .drag-handle:active { cursor: grabbing; }

    .drop-active {
      outline: 1px dashed rgba(104,232,255,.50);
      outline-offset: 2px;
      background: rgba(104,232,255,.06);
    }

    .toast-stack {
      position: fixed;
      left: 16px;
      bottom: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      z-index: 60;
      pointer-events: none;
      max-width: min(92vw, 360px);
    }

    .toast {
      pointer-events: auto;
      background: linear-gradient(180deg, rgba(20,28,42,.90), rgba(12,18,28,.88));
      border: 1px solid rgba(255,255,255,.10);
      color: var(--text);
      border-radius: 999px;
      padding: 11px 14px;
      box-shadow: var(--shadow);
      display: inline-flex;
      align-items: center;
      gap: 10px;
      max-width: 100%;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
      transform: translateX(0);
      opacity: 1;
      transition: transform .18s ease, opacity .18s ease;
      touch-action: pan-y;
      user-select: none;
    }
    body[data-theme="light"] .toast {
      background: linear-gradient(180deg, rgba(255,255,255,.92), rgba(244,248,252,.88));
      color: #102235;
      border-color: rgba(16,34,53,.10);
    }
    .toast.swiping { transition: none; }
    .toast.fade-out { opacity: 0; transform: translateX(-18px); }
    .toast-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      flex: 0 0 auto;
      background: var(--accent);
      box-shadow: 0 0 0 6px rgba(104,232,255,.10);
    }

    @media (max-width: 860px) {
      .panel-wrap { width: min(100%, calc(100vw - 10px)); }
      .content { width: min(100%, calc(100vw - 10px)); }
      .input { width: 180px; }
    }

    @media (max-width: 560px) {
      .panel-wrap { top: 8px; }
      .panel { padding: 10px; }
      .input { width: 160px; }
      .toast-stack { left: 12px; bottom: 12px; right: 12px; max-width: calc(100vw - 24px); }
      .item { grid-template-columns: auto minmax(0, 1fr) auto; }
      .drag-handle { width: 34px; height: 34px; }
      .small-btn { padding: 8px 9px; }
      .shell, .panel { backdrop-filter: blur(10px) saturate(150%); -webkit-backdrop-filter: blur(10px) saturate(150%); }
    }
  </style>
</head>
<body data-font="medium" data-theme="dark">
  <div class="app">
    <div id="panelWrap" class="panel-wrap">
      <div class="panel">
        <div class="toolbar">
          <input id="itemInput" class="input" type="text" placeholder="Add item" maxlength="120" autocomplete="off" />
          <button id="addBtn" class="chip btn-add" type="button">Add</button>
          <button id="groupBtn" class="chip btn-group" type="button">+ Group</button>
          <button id="clearBtn" class="chip btn-clear" type="button">Clear Checks</button>
          <button id="themeBtn" class="chip btn-theme" type="button">Theme: Dark</button>
          <label class="toggle" title="When on, all items are shown as just Active and Done">
            <span>Group Done</span>
            <input id="groupDone" type="checkbox" />
            <span class="switch"></span>
          </label>
          <select id="fontSelect" class="select" aria-label="Font size">
            <option value="small">Font: Small</option>
            <option value="medium">Font: Medium</option>
            <option value="large">Font: Large</option>
            <option value="xl">Font: Extra Large</option>
          </select>
          <div class="range-wrap">
            <div class="range-label"><span>Tile Height</span><span id="sizeLabel">100%</span></div>
            <input id="sizeSlider" class="range" type="range" min="85" max="140" value="100" />
          </div>
        </div>
      </div>
    </div>

    <div id="contentRoot" class="content"></div>
  </div>

  <div id="toastStack" class="toast-stack" aria-live="polite" aria-atomic="false"></div>

  <script>
    const STORAGE_KEY = "shopping_list_state_v8";
    const API_BASE_URL = (() => {
      const saved = localStorage.getItem("shopping_api_base");
      if (saved) return saved.replace(/\/$/, "");
      if (location.hostname.endsWith(".vercel.app")) return location.origin;
      return "https://YOUR-VERCEL-DOMAIN.vercel.app";
    })();
    const API_LIST_URL = `${API_BASE_URL}/api/list`;
    const API_SAVE_URL = `${API_BASE_URL}/api/save`;

    const state = {
      items: [],
      groups: [],
      drag: null,
      swipe: null,
      syncTimer: null,
      fontSize: localStorage.getItem("shopping_font_size") || "medium",
      tileSize: Number(localStorage.getItem("shopping_tile_size") || 100),
      groupDone: localStorage.getItem("shopping_group_done") === "true",
      theme: localStorage.getItem("shopping_theme") || "dark",
    };

    const panelWrap = document.getElementById("panelWrap");
    const contentRoot = document.getElementById("contentRoot");
    const inputEl = document.getElementById("itemInput");
    const addBtn = document.getElementById("addBtn");
    const groupBtn = document.getElementById("groupBtn");
    const clearBtn = document.getElementById("clearBtn");
    const themeBtn = document.getElementById("themeBtn");
    const groupDoneEl = document.getElementById("groupDone");
    const fontSelectEl = document.getElementById("fontSelect");
    const sizeSlider = document.getElementById("sizeSlider");
    const sizeLabel = document.getElementById("sizeLabel");
    const toastStack = document.getElementById("toastStack");

    document.body.dataset.font = state.fontSize;
    document.body.dataset.theme = state.theme;
    groupDoneEl.checked = state.groupDone;
    fontSelectEl.value = state.fontSize;
    sizeSlider.value = String(state.tileSize);
    document.documentElement.style.setProperty("--tile-scale", String(state.tileSize / 100));
    sizeLabel.textContent = `${state.tileSize}%`;
    themeBtn.textContent = `Theme: ${state.theme === "dark" ? "Dark" : "Light"}`;

    function uid() {
      return crypto?.randomUUID ? crypto.randomUUID() : String(Date.now() + Math.random()).replace(".", "");
    }

    function escapeHtml(str) {
      return String(str)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#39;");
    }

    function showToast(message) {
      const toast = document.createElement("div");
      toast.className = "toast";
      toast.innerHTML = `<span class="toast-dot"></span><span>${escapeHtml(message)}</span>`;
      toastStack.appendChild(toast);

      let startX = 0;
      let currentX = 0;
      let active = false;

      const dismiss = () => {
        if (!toast.isConnected) return;
        toast.classList.add("fade-out");
        setTimeout(() => toast.remove(), 180);
      };

      toast.addEventListener("pointerdown", (e) => {
        active = true;
        startX = e.clientX;
        currentX = startX;
        toast.classList.add("swiping");
        try { toast.setPointerCapture(e.pointerId); } catch (_) {}
      });

      toast.addEventListener("pointermove", (e) => {
        if (!active) return;
        currentX = e.clientX;
        const dx = currentX - startX;
        toast.style.transform = `translateX(${dx}px)`;
        toast.style.opacity = String(Math.max(0.3, 1 - Math.abs(dx) / 200));
      });

      const finish = () => {
        if (!active) return;
        active = false;
        const dx = currentX - startX;
        toast.classList.remove("swiping");
        if (Math.abs(dx) > 70) dismiss();
        else {
          toast.style.transform = "";
          toast.style.opacity = "1";
        }
      };

      toast.addEventListener("pointerup", finish);
      toast.addEventListener("pointercancel", finish);
      toast.addEventListener("pointerleave", finish);
      setTimeout(dismiss, 3000);
    }

    function persistLocal() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify({ items: state.items, groups: state.groups }));
    }

    function setFontSize(size) {
      state.fontSize = size;
      document.body.dataset.font = size;
      localStorage.setItem("shopping_font_size", size);
    }

    function setTileSize(size) {
      state.tileSize = size;
      document.documentElement.style.setProperty("--tile-scale", String(size / 100));
      localStorage.setItem("shopping_tile_size", String(size));
      sizeLabel.textContent = `${size}%`;
    }

    function setTheme(theme) {
      state.theme = theme;
      document.body.dataset.theme = theme;
      localStorage.setItem("shopping_theme", theme);
      themeBtn.textContent = `Theme: ${theme === "dark" ? "Dark" : "Light"}`;
      showToast(`${theme === "dark" ? "Dark" : "Light"} theme on`);
    }

    function normalizeGroupOrders() {
      [...state.groups].sort((a, b) => a.order - b.order).forEach((g, i) => g.order = i);
    }

    function normalizeItemsByGroup(groupId) {
      const arr = state.items.filter(i => (i.groupId || null) === (groupId || null)).sort((a, b) => a.order - b.order);
      arr.forEach((i, idx) => i.order = idx);
    }

    function getOrderedGroups() {
      return [...state.groups].sort((a, b) => a.order - b.order);
    }

    function getItemsByGroup(groupId) {
      return state.items.filter(i => (i.groupId || null) === (groupId || null)).sort((a, b) => a.order - b.order);
    }

    function loadLocal() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return false;
        const parsed = JSON.parse(raw);
        if (Array.isArray(parsed)) {
          state.items = parsed.map((item, index) => ({
            id: item.id || uid(),
            text: String(item.text || "").trim(),
            checked: !!item.checked,
            order: Number.isFinite(item.order) ? item.order : index,
            groupId: item.groupId || null,
          })).filter(item => item.text);
          state.groups = [];
        } else if (parsed && typeof parsed === "object") {
          state.items = Array.isArray(parsed.items)
            ? parsed.items.map((item, index) => ({
                id: item.id || uid(),
                text: String(item.text || "").trim(),
                checked: !!item.checked,
                order: Number.isFinite(item.order) ? item.order : index,
                groupId: item.groupId || null,
              })).filter(item => item.text)
            : [];
          state.groups = Array.isArray(parsed.groups)
            ? parsed.groups.map((g, index) => ({
                id: g.id || uid(),
                name: String(g.name || "Group").trim() || "Group",
                order: Number.isFinite(g.order) ? g.order : index,
              }))
            : [];
        }
        normalizeGroupOrders();
        normalizeItemsByGroup(null);
        state.groups.forEach(g => normalizeItemsByGroup(g.id));
        persistLocal();
        return true;
      } catch (e) {
        return false;
      }
    }

    async function loadRemote() {
      try {
        const res = await fetch(API_LIST_URL, { cache: "no-store" });
        if (!res.ok) throw new Error("remote load failed");
        const data = await res.json();
        if (Array.isArray(data.items) || Array.isArray(data.groups)) {
          state.items = Array.isArray(data.items)
            ? data.items.map((item, index) => ({
                id: item.id || uid(),
                text: String(item.text || "").trim(),
                checked: !!item.checked,
                order: Number.isFinite(item.order) ? item.order : index,
                groupId: item.groupId || null,
              })).filter(item => item.text)
            : state.items;
          state.groups = Array.isArray(data.groups)
            ? data.groups.map((g, index) => ({
                id: g.id || uid(),
                name: String(g.name || "Group").trim() || "Group",
                order: Number.isFinite(g.order) ? g.order : index,
              }))
            : state.groups;
          normalizeGroupOrders();
          normalizeItemsByGroup(null);
          state.groups.forEach(g => normalizeItemsByGroup(g.id));
          persistLocal();
          return true;
        }
      } catch (e) {}
      return false;
    }

    function queueRemoteSave() {
      clearTimeout(state.syncTimer);
      state.syncTimer = setTimeout(syncRemote, 350);
    }

    async function syncRemote() {
      persistLocal();
      try {
        await fetch(API_SAVE_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ items: state.items, groups: state.groups })
        });
      } catch (e) {}
    }

    function saveNow() {
      normalizeGroupOrders();
      normalizeItemsByGroup(null);
      state.groups.forEach(g => normalizeItemsByGroup(g.id));
      render();
      queueRemoteSave();
    }

    function addItem(text) {
      const value = text.trim();
      if (!value) return;
      const topOrder = state.items.filter(i => (i.groupId || null) === null).reduce((min, item) => Math.min(min, item.order), 0);
      state.items.push({ id: uid(), text: value, checked: false, order: topOrder - 1, groupId: null });
      saveNow();
      showToast("Item added");
    }

    function addGroup() {
      const name = prompt("Group name:");
      if (!name) return;
      const value = name.trim();
      if (!value) return;
      const nextOrder = state.groups.length ? Math.max(...state.groups.map(g => g.order)) + 1 : 0;
      state.groups.push({ id: uid(), name: value, order: nextOrder });
      saveNow();
      showToast("Group added");
    }

    function deleteGroup(groupId) {
      const group = state.groups.find(g => g.id === groupId);
      if (!group) return;
      if (!confirm(`Delete group \"${group.name}\"? Items will move out.`)) return;
      state.items = state.items.map(item => item.groupId === groupId ? { ...item, groupId: null } : item);
      state.groups = state.groups.filter(g => g.id !== groupId);
      normalizeGroupOrders();
      normalizeItemsByGroup(null);
      saveNow();
      showToast("Group deleted");
    }

    function toggleItem(id, checked) {
      const item = state.items.find(i => i.id === id);
      if (!item) return;
      item.checked = checked;
      saveNow();
    }

    function clearChecks() {
      if (!state.items.some(i => i.checked)) return;
      if (!confirm("Clear all checks?")) return;
      state.items = state.items.map(i => ({ ...i, checked: false }));
      saveNow();
      showToast("Checks cleared");
    }

    function moveItemToGroupTop(itemId, groupId) {
      const moving = state.items.find(i => i.id === itemId);
      if (!moving) return;
      moving.groupId = groupId;
      const bucket = getItemsByGroup(groupId).filter(i => i.id !== itemId);
      bucket.unshift(moving);
      bucket.forEach((i, idx) => i.order = idx);
      state.items = state.items.map(i => i.id === moving.id ? moving : i);
      normalizeItemsByGroup(null);
      state.groups.forEach(g => normalizeItemsByGroup(g.id));
      saveNow();
    }

    function moveItemToUngroupedTop(itemId) {
      const moving = state.items.find(i => i.id === itemId);
      if (!moving) return;
      moving.groupId = null;
      const bucket = getItemsByGroup(null).filter(i => i.id !== itemId);
      bucket.unshift(moving);
      bucket.forEach((i, idx) => i.order = idx);
      state.items = state.items.map(i => i.id === moving.id ? moving : i);
      normalizeItemsByGroup(null);
      state.groups.forEach(g => normalizeItemsByGroup(g.id));
      saveNow();
    }

    function moveItemBeforeTarget(itemId, targetItemId) {
      const moving = state.items.find(i => i.id === itemId);
      const target = state.items.find(i => i.id === targetItemId);
      if (!moving || !target || moving.id === target.id) return;
      moving.groupId = target.groupId || null;
      const bucket = getItemsByGroup(target.groupId || null).filter(i => i.id !== itemId);
      const idx = bucket.findIndex(i => i.id === targetItemId);
      bucket.splice(Math.max(0, idx), 0, moving);
      bucket.forEach((i, n) => i.order = n);
      state.items = state.items.map(i => i.id === moving.id ? moving : i);
      normalizeItemsByGroup(null);
      state.groups.forEach(g => normalizeItemsByGroup(g.id));
      saveNow();
    }

    function moveItemAfterTarget(itemId, targetItemId) {
      const moving = state.items.find(i => i.id === itemId);
      const target = state.items.find(i => i.id === targetItemId);
      if (!moving || !target || moving.id === target.id) return;
      moving.groupId = target.groupId || null;
      const bucket = getItemsByGroup(target.groupId || null).filter(i => i.id !== itemId);
      const idx = bucket.findIndex(i => i.id === targetItemId);
      bucket.splice(Math.max(0, idx + 1), 0, moving);
      bucket.forEach((i, n) => i.order = n);
      state.items = state.items.map(i => i.id === moving.id ? moving : i);
      normalizeItemsByGroup(null);
      state.groups.forEach(g => normalizeItemsByGroup(g.id));
      saveNow();
    }

    function findDropContext(x, y) {
      const el = document.elementFromPoint(x, y);
      if (!el) return null;
      const item = el.closest?.('.item[data-item-id]');
      if (item) return { type: 'item', id: item.dataset.itemId, el: item };
      const zone = el.closest?.('.drop-zone[data-group-id]');
      if (zone) return { type: 'zone', groupId: zone.dataset.groupId || null, el: zone };
      return null;
    }

    function renderItem(item) {
      const li = document.createElement("li");
      li.className = "item" + (item.checked ? " done" : "");
      li.dataset.itemId = item.id;
      li.innerHTML = `
        <div class="check-wrap">
          <input type="checkbox" class="check" data-action="toggle" data-id="${item.id}" ${item.checked ? "checked" : ""} />
        </div>
        <div class="text">${escapeHtml(item.text)}</div>
        <div class="drag-handle" data-action="drag" data-id="${item.id}" title="Drag">≡</div>
      `;
      return li;
    }

    function buildListSection(title, items, groupId = null, showGroupDelete = false) {
      const shell = document.createElement("div");
      shell.className = "shell";
      const head = document.createElement("div");
      head.className = "section-head";
      head.innerHTML = `<h2 class="section-title">${escapeHtml(title)}</h2><div class="group-actions"></div>`;
      if (showGroupDelete && groupId) {
        const btn = document.createElement("button");
        btn.className = "small-btn";
        btn.type = "button";
        btn.textContent = "Delete";
        btn.dataset.action = "delete-group";
        btn.dataset.groupId = groupId;
        head.querySelector(".group-actions").appendChild(btn);
      }
      shell.appendChild(head);
      const zone = document.createElement("div");
      zone.className = "drop-zone";
      zone.dataset.groupId = groupId || "";
      const list = document.createElement("ul");
      list.className = "list";
      items.forEach(item => list.appendChild(renderItem(item)));
      zone.appendChild(list);
      shell.appendChild(zone);
      return shell;
    }    function render() {
      const root = document.createDocumentFragment();

      if (state.groupDone) {
        const ordered = [...state.items].sort((a, b) => a.order - b.order);
        const active = ordered.filter(i => !i.checked);
        const done = ordered.filter(i => i.checked);
        root.appendChild(buildListSection("List", active, null, false));
        if (done.length) {
          const doneShell = document.createElement("div");
          doneShell.className = "shell";
          const doneHead = document.createElement("div");
          doneHead.className = "section-head";
          doneHead.innerHTML = `<h2 class="section-title">Done</h2><div class="group-actions"></div>`;
          doneShell.appendChild(doneHead);
          const zone = document.createElement("div");
          zone.className = "drop-zone";
          zone.dataset.groupId = "done-section";
          const list = document.createElement("ul");
          list.className = "list";
          done.forEach(item => list.appendChild(renderItem(item)));
          zone.appendChild(list);
          doneShell.appendChild(zone);
          root.appendChild(doneShell);
        }
      } else {
        root.appendChild(buildListSection("List", getItemsByGroup(null), null, false));
        getOrderedGroups().forEach(group => root.appendChild(buildListSection(group.name, getItemsByGroup(group.id), group.id, true)));
      }
      contentRoot.replaceChildren(root);
    }

    function handleItemDrop(sourceId, x, y) {
      if (state.groupDone) {
        const target = findDropContext(x, y);
        if (!target) return;
        if (target.type === 'item') {
          const rect = target.el.getBoundingClientRect();
          const before = y < rect.top + rect.height / 2;
          if (before) moveItemBeforeTarget(sourceId, target.id);
          else moveItemAfterTarget(sourceId, target.id);
          return;
        }
        if (target.type === 'zone') {
          if (target.groupId === 'done-section') {
            const moving = state.items.find(i => i.id === sourceId);
            if (moving) { moving.checked = true; saveNow(); }
          } else {
            const moving = state.items.find(i => i.id === sourceId);
            if (moving) { moving.checked = false; saveNow(); }
          }
        }
        return;
      }

      const target = findDropContext(x, y);
      if (!target) {
        moveItemToUngroupedTop(sourceId);
        return;
      }
      if (target.type === 'item') {
        const rect = target.el.getBoundingClientRect();
        const before = y < rect.top + rect.height / 2;
        if (before) moveItemBeforeTarget(sourceId, target.id);
        else moveItemAfterTarget(sourceId, target.id);
        return;
      }
      if (target.type === 'zone') moveItemToGroupTop(sourceId, target.groupId || null);
    }

    document.addEventListener("change", (e) => {
      const t = e.target;
      if (t.matches('input[type="checkbox"][data-action="toggle"]')) toggleItem(t.dataset.id, t.checked);
    });

    document.addEventListener("click", (e) => {
      const action = e.target.closest("[data-action]");
      if (!action) return;
      if (action.dataset.action === "delete-group") deleteGroup(action.dataset.groupId);
    });

    // Drag handle ordering
    document.addEventListener("pointerdown", (e) => {
      const handle = e.target.closest('.drag-handle[data-action="drag"]');
      if (!handle) return;
      const itemEl = handle.closest('.item');
      if (!itemEl) return;
      state.drag = {
        id: handle.dataset.id,
        pointerId: e.pointerId,
        currentX: e.clientX,
        currentY: e.clientY,
        el: itemEl,
        active: true
      };
      itemEl.classList.add("dragging");
      try { handle.setPointerCapture(e.pointerId); } catch (_) {}
    });

    document.addEventListener("pointermove", (e) => {
      if (!state.drag || !state.drag.active || e.pointerId !== state.drag.pointerId) return;
      state.drag.currentX = e.clientX;
      state.drag.currentY = e.clientY;
    });

    document.addEventListener("pointerup", (e) => {
      if (!state.drag || e.pointerId !== state.drag.pointerId) return;
      const { id, currentX, currentY, el } = state.drag;
      el.classList.remove("dragging");
      handleItemDrop(id, currentX, currentY);
      state.drag = null;
      clearDropHighlights();
    });

    document.addEventListener("pointercancel", (e) => {
      if (!state.drag || e.pointerId !== state.drag.pointerId) return;
      state.drag.el.classList.remove("dragging");
      state.drag = null;
      clearDropHighlights();
    });

    function clearDropHighlights() {
      document.querySelectorAll(".drop-active").forEach(el => el.classList.remove("drop-active"));
    }

    document.addEventListener("pointermove", (e) => {
      if (!state.drag) return;
      clearDropHighlights();
      const target = findDropContext(e.clientX, e.clientY);
      if (target?.el) target.el.classList.add("drop-active");
    });

    // Swipe delete (works on phone and desktop)
    document.addEventListener("pointerdown", (e) => {
      const item = e.target.closest(".item[data-item-id]");
      if (!item) return;
      if (e.target.closest(".drag-handle") || e.target.closest(".check")) return;
      state.swipe = {
        el: item,
        id: item.dataset.itemId,
        pointerId: e.pointerId,
        startX: e.clientX,
        startY: e.clientY,
        currentX: e.clientX,
        currentY: e.clientY,
        active: true,
        swiping: false,
      };
      item.classList.add("swiping");
      try { item.setPointerCapture(e.pointerId); } catch (_) {}
    });

    document.addEventListener("pointermove", (e) => {
      if (!state.swipe || !state.swipe.active || e.pointerId !== state.swipe.pointerId) return;
      state.swipe.currentX = e.clientX;
      state.swipe.currentY = e.clientY;
      const dx = state.swipe.currentX - state.swipe.startX;
      const dy = state.swipe.currentY - state.swipe.startY;
      if (!state.swipe.swiping) {
        if (Math.abs(dx) > 12 && Math.abs(dx) > Math.abs(dy)) state.swipe.swiping = true;
        else return;
      }
      e.preventDefault();
      state.swipe.el.style.transform = `translateX(${dx}px)`;
      state.swipe.el.style.opacity = String(Math.max(.35, 1 - Math.abs(dx) / 240));
    }, { passive: false });

    function finishSwipe(e) {
      if (!state.swipe || e.pointerId !== state.swipe.pointerId) return;
      const swipe = state.swipe;
      swipe.el.classList.remove("swiping");
      const dx = swipe.currentX - swipe.startX;
      if (swipe.swiping && Math.abs(dx) > 90) {
        swipe.el.classList.add("deleting");
        const id = swipe.id;
        state.swipe = null;
        setTimeout(() => {
          state.items = state.items.filter(i => i.id !== id);
          normalizeItemsByGroup(null);
          state.groups.forEach(g => normalizeItemsByGroup(g.id));
          saveNow();
          showToast("Item removed");
        }, 110);
        return;
      }
      swipe.el.style.transform = "";
      swipe.el.style.opacity = "";
      state.swipe = null;
    }

    document.addEventListener("pointerup", finishSwipe);
    document.addEventListener("pointercancel", finishSwipe);

    addBtn.addEventListener("click", () => {
      addItem(inputEl.value);
      inputEl.value = "";
      inputEl.focus({ preventScroll: true });
    });
    groupBtn.addEventListener("click", addGroup);
    clearBtn.addEventListener("click", clearChecks);
    themeBtn.addEventListener("click", () => setTheme(state.theme === "dark" ? "light" : "dark"));

    groupDoneEl.addEventListener("change", () => {
      state.groupDone = groupDoneEl.checked;
      localStorage.setItem("shopping_group_done", String(state.groupDone));
      render();
      showToast(state.groupDone ? "Done grouping on" : "Done grouping off");
    });

    fontSelectEl.addEventListener("change", () => {
      setFontSize(fontSelectEl.value);
      showToast("Font updated");
    });

    sizeSlider.addEventListener("input", () => setTileSize(Number(sizeSlider.value)));

    // Hide top panel while scrolling down, show while scrolling up
    let lastScrollY = window.scrollY;
    let scrollTick = false;
    window.addEventListener("scroll", () => {
      if (scrollTick) return;
      scrollTick = true;
      requestAnimationFrame(() => {
        const y = window.scrollY;
        if (y > 70 && y > lastScrollY + 6) panelWrap.classList.add("hidden");
        if (y < lastScrollY - 6 || y < 20) panelWrap.classList.remove("hidden");
        lastScrollY = y;
        scrollTick = false;
      });
    }, { passive: true });

    async function init() {
      const localLoaded = loadLocal();
      if (!localLoaded) {
        state.items = [];
        state.groups = [];
      }
      render();
      if (navigator.onLine !== false) {
        const remoteLoaded = await loadRemote();
        if (remoteLoaded) render();
      }
    }

    window.addEventListener("beforeunload", persistLocal);
    window.addEventListener("online", () => loadRemote().then(ok => { if (ok) render(); }));
    init();
  </script>
</body>
</html>
