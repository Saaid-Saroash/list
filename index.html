<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Shopping List</title>
  <style>
    :root {
      --bg: #0b0f14;
      --panel: #111722;
      --panel-2: #0f151f;
      --text: #e8edf5;
      --muted: #94a3b8;
      --line: #223047;
      --accent: #63e6ff;
      --accent-2: #8b5cf6;
      --danger: #ff6577;
      --success: #35d07f;
      --shadow: 0 10px 26px rgba(0, 0, 0, .22);
      --radius: 18px;
      --font-scale: 1;
      --tile-scale: 1;
    }

    [data-font="small"] { --font-scale: .94; }
    [data-font="medium"] { --font-scale: 1; }
    [data-font="large"] { --font-scale: 1.12; }
    [data-font="xl"] { --font-scale: 1.24; }

    * { box-sizing: border-box; }
    html, body { height: 100%; }

    body {
      margin: 0;
      font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      background: linear-gradient(180deg, #081018 0%, #0b0f14 100%);
      color: var(--text);
      overflow-x: hidden;
      font-size: calc(15px * var(--font-scale));
    }

    .app {
      max-width: 980px;
      margin: 0 auto;
      padding: 20px 14px 34px;
    }

    .shell {
      background: rgba(17, 23, 34, .92);
      border: 1px solid rgba(255, 255, 255, .06);
      border-radius: 24px;
      box-shadow: var(--shadow);
      padding: 16px;
      backdrop-filter: blur(12px);
    }

    .topbar {
      display: flex;
      gap: 12px;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      margin-bottom: 14px;
    }

    h1 {
      margin: 0;
      font-size: clamp(24px, 3.8vw, 34px);
      letter-spacing: -.04em;
      line-height: 1.05;
    }

    .controls {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto auto auto auto;
      gap: 10px;
      margin-top: 12px;
      align-items: stretch;
    }

    .input, .select, .range-wrap {
      width: 100%;
      border: 1px solid var(--line);
      background: rgba(8, 12, 18, .95);
      color: var(--text);
      border-radius: 14px;
      padding: 13px 14px;
      outline: none;
      font-size: 1em;
      transition: border-color .15s ease, box-shadow .15s ease, transform .15s ease;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, .02);
    }

    .input:focus, .select:focus {
      border-color: rgba(99, 230, 255, .6);
      box-shadow: 0 0 0 3px rgba(99, 230, 255, .10);
    }

    .btn {
      border: none;
      border-radius: 14px;
      padding: 13px 15px;
      font-weight: 700;
      font-size: .95em;
      color: #061018;
      cursor: pointer;
      transition: transform .15s ease, opacity .15s ease, filter .15s ease;
      white-space: nowrap;
      user-select: none;
    }

    .btn:hover { transform: translateY(-1px); }
    .btn:active { transform: translateY(1px); }

    .btn-add { background: linear-gradient(135deg, var(--accent), #9ae6ff); }
    .btn-clear { background: linear-gradient(135deg, #ffd166, #ff8f70); }

    .range-wrap {
      display: grid;
      gap: 8px;
      padding-top: 10px;
      padding-bottom: 10px;
    }

    .range-label {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      align-items: center;
      color: var(--muted);
      font-size: .88em;
      line-height: 1;
      user-select: none;
    }

    .range {
      width: 100%;
      accent-color: var(--accent);
    }

    .list {
      margin: 14px 0 0;
      padding: 0;
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 8px;
      min-height: 72px;
      contain: content;
    }

    .item {
      position: relative;
      display: grid;
      grid-template-columns: auto minmax(0, 1fr) auto;
      gap: 10px;
      align-items: center;
      padding: calc(12px * var(--tile-scale)) 12px;
      min-height: calc(56px * var(--tile-scale));
      background: linear-gradient(180deg, rgba(255, 255, 255, .045), rgba(255, 255, 255, .02));
      border: 1px solid rgba(255, 255, 255, .07);
      border-radius: 16px;
      overflow: hidden;
      touch-action: pan-y;
      will-change: transform, opacity;
    }

    .item::before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(90deg, rgba(99, 230, 255, .06), transparent 24%, transparent 76%, rgba(139, 92, 246, .06));
      opacity: 0;
      pointer-events: none;
      transition: opacity .15s ease;
    }

    .item:hover::before { opacity: 1; }

    .item.done .text {
      color: rgba(232, 237, 245, .58);
      text-decoration: line-through;
      text-decoration-thickness: 2px;
    }

    .check-wrap {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 22px;
      flex: 0 0 auto;
    }

    .check {
      appearance: none;
      width: 22px;
      height: 22px;
      border-radius: 7px;
      border: 2px solid #4b5d79;
      background: rgba(7, 10, 15, .85);
      display: grid;
      place-items: center;
      cursor: pointer;
      margin: 0;
      transition: .15s ease;
    }

    .check::after {
      content: "";
      width: 10px;
      height: 5px;
      border-left: 3px solid transparent;
      border-bottom: 3px solid transparent;
      transform: rotate(-45deg) translateY(-1px);
    }

    .check:checked {
      border-color: rgba(53, 208, 127, .95);
      background: rgba(53, 208, 127, .16);
      box-shadow: 0 0 0 4px rgba(53, 208, 127, .08);
    }

    .check:checked::after {
      border-left-color: var(--success);
      border-bottom-color: var(--success);
    }

    .text {
      min-width: 0;
      line-height: 1.35;
      word-break: break-word;
      user-select: none;
    }

    .actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex: 0 0 auto;
    }

    .drag-handle,
    .delete-btn {
      width: 34px;
      height: 34px;
      display: grid;
      place-items: center;
      border-radius: 11px;
      user-select: none;
      border: 1px solid rgba(255, 255, 255, .07);
      background: rgba(255, 255, 255, .04);
      color: #d4dce8;
      flex: 0 0 auto;
    }

    .drag-handle {
      cursor: grab;
      font-size: 18px;
      line-height: 1;
      touch-action: none;
    }

    .delete-btn {
      cursor: pointer;
      border-color: rgba(255, 101, 119, .20);
      color: #ff9aa4;
      font-size: 16px;
    }

    .drag-handle:active { cursor: grabbing; }

    .item.swiping {
      transition: none;
    }

    .item.deleting {
      opacity: 0;
      transform: scale(.97);
      transition: opacity .15s ease, transform .15s ease;
    }

    .drop-line {
      height: 2px;
      margin: 0 10px;
      border-radius: 999px;
      background: rgba(99, 230, 255, .6);
      box-shadow: 0 0 0 3px rgba(99, 230, 255, .10);
    }

    @media (max-width: 900px) {
      .controls {
        grid-template-columns: 1fr 1fr;
      }
      .input { grid-column: 1 / -1; }
      .btn-add { grid-column: 1 / span 1; }
      .btn-clear { grid-column: 2 / span 1; }
      .select { grid-column: 1 / span 1; }
      .range-wrap { grid-column: 2 / span 1; }
    }

    @media (max-width: 540px) {
      .controls {
        grid-template-columns: 1fr;
      }
      .input,
      .btn-add,
      .btn-clear,
      .select,
      .range-wrap {
        grid-column: 1 / -1;
      }
      .item {
        grid-template-columns: auto minmax(0, 1fr) auto;
        padding-right: 10px;
      }
      .actions { gap: 6px; }
      .drag-handle, .delete-btn { width: 32px; height: 32px; }
    }
  </style>
</head>
<body data-font="medium">
  <div class="app">
    <div class="shell">
      <div class="topbar">
        <h1>Shopping List</h1>
      </div>

      <div class="controls">
        <input id="itemInput" class="input" type="text" placeholder="Add item" maxlength="120" autocomplete="off" />
        <button id="addBtn" class="btn btn-add">Add Item</button>
        <button id="clearBtn" class="btn btn-clear">Clear Checks</button>

        <select id="fontSize" class="select" aria-label="Font size">
          <option value="small">Font: Small</option>
          <option value="medium" selected>Font: Medium</option>
          <option value="large">Font: Large</option>
          <option value="xl">Font: Extra Large</option>
        </select>

        <div class="range-wrap">
          <div class="range-label"><span>Tile Size</span><span id="tileLabel">100%</span></div>
          <input id="tileSize" class="range" type="range" min="85" max="140" value="100" />
        </div>
      </div>

      <ul id="list" class="list"></ul>
    </div>
  </div>

  <div id="toast" class="toast"></div>

  <script>
    const STORAGE_KEY = "shopping_list_dark_v3";

    // Change this if the front-end is hosted on GitHub Pages.
    // GitHub Pages cannot run /api routes, so the API must live on Vercel.
    const API_BASE_URL = (() => {
      const saved = localStorage.getItem("shopping_api_base");
      if (saved) return saved.replace(/\/$/, "");
      if (location.hostname.endsWith(".vercel.app")) return location.origin;
      return "https://YOUR-PROJECT-NAME.vercel.app";
    })();

    const API_LIST_URL = `${API_BASE_URL}/api/list`;
    const API_SAVE_URL = `${API_BASE_URL}/api/save`;

    const state = {
      items: [],
      syncTimer: null,
      dragId: null,
      swipeItem: null,
      fontSize: localStorage.getItem("shopping_font_size") || "medium",
      tileSize: Number(localStorage.getItem("shopping_tile_size") || 100),
    };

    const listEl = document.getElementById("list");
    const inputEl = document.getElementById("itemInput");
    const addBtn = document.getElementById("addBtn");
    const clearBtn = document.getElementById("clearBtn");
    const fontSizeEl = document.getElementById("fontSize");
    const tileSizeEl = document.getElementById("tileSize");
    const tileLabelEl = document.getElementById("tileLabel");
    const toast = document.getElementById("toast");

    fontSizeEl.value = state.fontSize;
    tileSizeEl.value = String(state.tileSize);
    document.body.dataset.font = state.fontSize;
    document.documentElement.style.setProperty("--tile-scale", String(state.tileSize / 100));
    tileLabelEl.textContent = `${state.tileSize}%`;

    function uid() {
      return crypto?.randomUUID ? crypto.randomUUID() : String(Date.now() + Math.random()).replace(".", "");
    }

    function showToast(message) {
      toast.textContent = message;
      toast.classList.add("show");
      clearTimeout(showToast._t);
      showToast._t = setTimeout(() => toast.classList.remove("show"), 1300);
    }

    function sortedItems() {
      return [...state.items].sort((a, b) => {
        if (a.checked !== b.checked) return Number(a.checked) - Number(b.checked);
        return a.order - b.order;
      });
    }

    function normalizeOrder(items = state.items) {
      const view = [...items].sort((a, b) => {
        if (a.checked !== b.checked) return Number(a.checked) - Number(b.checked);
        return a.order - b.order;
      });
      return view.map((item, index) => ({ ...item, order: index }));
    }

    function persistLocal() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state.items));
    }

    function setFontSize(size) {
      state.fontSize = size;
      document.body.dataset.font = size;
      localStorage.setItem("shopping_font_size", size);
    }

    function setTileSize(size) {
      state.tileSize = size;
      document.documentElement.style.setProperty("--tile-scale", String(size / 100));
      localStorage.setItem("shopping_tile_size", String(size));
      tileLabelEl.textContent = `${size}%`;
    }

    async function loadRemote() {
      try {
        const res = await fetch(API_LIST_URL, { cache: "no-store" });
        if (!res.ok) throw new Error("remote load failed");
        const data = await res.json();
        if (Array.isArray(data.items)) {
          state.items = normalizeOrder(
            data.items
              .map((item, index) => ({
                id: item.id || uid(),
                text: String(item.text || "").trim(),
                checked: !!item.checked,
                order: Number.isFinite(item.order) ? item.order : index,
              }))
              .filter(item => item.text)
          );
          persistLocal();
          return true;
        }
      } catch (e) {}
      return false;
    }

    function loadLocal() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return false;
        const parsed = JSON.parse(raw);
        if (!Array.isArray(parsed)) return false;
        state.items = normalizeOrder(
          parsed
            .map((item, index) => ({
              id: item.id || uid(),
              text: String(item.text || "").trim(),
              checked: !!item.checked,
              order: Number.isFinite(item.order) ? item.order : index,
            }))
            .filter(item => item.text)
        );
        return true;
      } catch (e) {
        return false;
      }
    }

    function queueRemoteSave() {
      clearTimeout(state.syncTimer);
      state.syncTimer = setTimeout(syncRemote, 250);
    }

    async function syncRemote() {
      persistLocal();
      try {
        await fetch(API_SAVE_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ items: state.items })
        });
      } catch (e) {}
    }

    function saveNow() {
      state.items = normalizeOrder(state.items);
      render();
      queueRemoteSave();
    }

    function addItem(text) {
      const value = text.trim();
      if (!value) return;
      state.items.push({
        id: uid(),
        text: value,
        checked: false,
        order: state.items.length,
      });
      saveNow();
      showToast("Added");
    }

    function toggleItem(id, checked) {
      const item = state.items.find(i => i.id === id);
      if (!item) return;
      item.checked = checked;
      state.items = normalizeOrder(state.items);
      saveNow();
    }

    function deleteItem(id) {
      state.items = state.items.filter(i => i.id !== id);
      state.items = normalizeOrder(state.items);
      saveNow();
      showToast("Deleted");
    }

    function clearChecks() {
      if (!state.items.some(i => i.checked)) return;
      if (!confirm("Clear all checks?")) return;
      state.items = state.items.map(i => ({ ...i, checked: false }));
      state.items = normalizeOrder(state.items);
      saveNow();
      showToast("Checks cleared");
    }

    function reorderByVisibleOrder(fromId, toId) {
      const view = sortedItems();
      const fromIndex = view.findIndex(i => i.id === fromId);
      const toIndex = view.findIndex(i => i.id === toId);
      if (fromIndex < 0 || toIndex < 0 || fromIndex === toIndex) return;
      const moving = view.splice(fromIndex, 1)[0];
      view.splice(toIndex, 0, moving);
      state.items = view.map((item, index) => ({ ...item, order: index }));
      saveNow();
    }

    function render() {
      const view = sortedItems();
      const fragment = document.createDocumentFragment();
      listEl.replaceChildren();

      for (const item of view) {
        const li = document.createElement("li");
        li.className = "item" + (item.checked ? " done" : "");
        li.dataset.id = item.id;

        li.innerHTML = `
          <div class="check-wrap">
            <input type="checkbox" class="check" data-action="toggle" data-id="${item.id}" ${item.checked ? "checked" : ""} />
          </div>
          <div class="text">${escapeHtml(item.text)}</div>
          <div class="actions">
            <div class="drag-handle" draggable="true" data-action="drag" data-id="${item.id}" title="Drag">≡</div>
            <button type="button" class="delete-btn" data-action="delete" data-id="${item.id}" title="Delete">×</button>
          </div>
        `;

        fragment.appendChild(li);
      }

      listEl.appendChild(fragment);
    }

    function escapeHtml(str) {
      return str
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#39;");
    }

    listEl.addEventListener("change", (e) => {
      const target = e.target;
      if (target.matches('input[type="checkbox"][data-action="toggle"]')) {
        toggleItem(target.dataset.id, target.checked);
      }
    });

    listEl.addEventListener("click", (e) => {
      const btn = e.target.closest("[data-action]");
      if (!btn) return;
      if (btn.dataset.action === "delete") {
        deleteItem(btn.dataset.id);
      }
    });

    listEl.addEventListener("dragstart", (e) => {
      const handle = e.target.closest('.drag-handle[data-action="drag"]');
      if (!handle) return;
      state.dragId = handle.dataset.id;
      e.dataTransfer.effectAllowed = "move";
      e.dataTransfer.setData("text/plain", state.dragId);
    });

    listEl.addEventListener("dragover", (e) => {
      if (!state.dragId) return;
      const item = e.target.closest(".item");
      if (!item) return;
      e.preventDefault();
    });

    listEl.addEventListener("drop", (e) => {
      if (!state.dragId) return;
      const item = e.target.closest(".item");
      if (!item) return;
      e.preventDefault();
      const fromId = state.dragId || e.dataTransfer.getData("text/plain");
      const toId = item.dataset.id;
      if (fromId && toId) reorderByVisibleOrder(fromId, toId);
      state.dragId = null;
    });

    listEl.addEventListener("pointerdown", (e) => {
      const item = e.target.closest(".item");
      if (!item) return;
      if (e.target.closest(".drag-handle") || e.target.closest(".check") || e.target.closest(".delete-btn")) return;
      state.swipeItem = {
        id: item.dataset.id,
        el: item,
        startX: e.clientX,
        currentX: e.clientX,
        active: true
      };
      item.classList.add("swiping");
      try { item.setPointerCapture(e.pointerId); } catch (_) {}
    });

    listEl.addEventListener("pointermove", (e) => {
      if (!state.swipeItem || !state.swipeItem.active) return;
      state.swipeItem.currentX = e.clientX;
      const deltaX = state.swipeItem.currentX - state.swipeItem.startX;
      state.swipeItem.el.style.transform = `translateX(${deltaX}px)`;
      state.swipeItem.el.style.opacity = String(Math.max(0.35, 1 - Math.abs(deltaX) / 240));
    });

    function finishSwipe() {
      if (!state.swipeItem) return;
      const { el, startX, currentX } = state.swipeItem;
      const deltaX = currentX - startX;
      el.classList.remove("swiping");

      if (Math.abs(deltaX) > 90) {
        el.classList.add("deleting");
        const id = state.swipeItem.id;
        state.swipeItem = null;
        setTimeout(() => deleteItem(id), 110);
        return;
      }

      el.style.transform = "";
      el.style.opacity = "";
      state.swipeItem = null;
    }

    listEl.addEventListener("pointerup", finishSwipe);
    listEl.addEventListener("pointercancel", finishSwipe);
    listEl.addEventListener("pointerleave", (e) => {
      if (state.swipeItem && state.swipeItem.active) finishSwipe();
    });

    addBtn.addEventListener("click", () => {
      addItem(inputEl.value);
      inputEl.value = "";
      inputEl.focus();
    });

    inputEl.addEventListener("keydown", (e) => {
      if (e.key === "Enter") addBtn.click();
    });

    clearBtn.addEventListener("click", clearChecks);

    fontSizeEl.addEventListener("change", () => {
      setFontSize(fontSizeEl.value);
      showToast("Font updated");
    });

    tileSizeEl.addEventListener("input", () => {
      setTileSize(Number(tileSizeEl.value));
    });

    async function init() {
      const remoteLoaded = await loadRemote();
      if (!remoteLoaded) loadLocal();
      state.items = normalizeOrder(state.items);
      render();
    }

    window.addEventListener("beforeunload", persistLocal);
    init();
  </script>
</body>
</html>
