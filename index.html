<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Shopping List</title>
  <style>
    :root {
      --bg0: #060b12;
      --bg1: #08111a;
      --glass: rgba(18, 24, 36, 0.58);
      --glass2: rgba(255, 255, 255, 0.06);
      --text: #e9eef7;
      --muted: #a0aec3;
      --line: rgba(255, 255, 255, 0.10);
      --accent: #68e8ff;
      --accent2: #9b7bff;
      --success: #35d07f;
      --shadow: 0 16px 40px rgba(0, 0, 0, 0.26);
      --radius-xl: 26px;
      --radius-lg: 18px;
      --radius-md: 14px;
      --font-scale: 1;
      --tile-scale: 1;
    }

    [data-font="small"] { --font-scale: 0.94; }
    [data-font="medium"] { --font-scale: 1; }
    [data-font="large"] { --font-scale: 1.12; }
    [data-font="xl"] { --font-scale: 1.24; }

    * { box-sizing: border-box; }
    html, body { height: 100%; }
    html { scroll-behavior: auto; }

    body {
      margin: 0;
      font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      font-size: calc(15px * var(--font-scale));
      color: var(--text);
      background:
        radial-gradient(circle at 8% 10%, rgba(104, 232, 255, 0.16), transparent 18%),
        radial-gradient(circle at 92% 8%, rgba(155, 123, 255, 0.14), transparent 18%),
        radial-gradient(circle at 50% 100%, rgba(53, 208, 127, 0.10), transparent 16%),
        linear-gradient(180deg, var(--bg1), var(--bg0));
      overflow-x: hidden;
      overflow-anchor: none;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background:
        linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
      background-size: 48px 48px;
      opacity: 0.12;
      mask-image: linear-gradient(180deg, rgba(0,0,0,0.35), transparent 85%);
    }

    .app {
      width: min(1040px, calc(100vw - 20px));
      margin: 0 auto;
      padding: 12px 0 30px;
    }

    .panel {
      width: min(760px, calc(100vw - 20px));
      margin: 0 auto;
      position: sticky;
      top: 10px;
      z-index: 10;
      background: linear-gradient(180deg, rgba(22, 30, 44, 0.72), rgba(16, 22, 34, 0.58));
      border: 1px solid rgba(255,255,255,0.10);
      border-radius: var(--radius-xl);
      box-shadow: var(--shadow);
      backdrop-filter: blur(18px) saturate(160%);
      -webkit-backdrop-filter: blur(18px) saturate(160%);
      padding: 12px;
      overflow: hidden;
    }

    .toolbar {
      display: flex;
      gap: 8px;
      align-items: stretch;
      flex-wrap: nowrap;
      overflow-x: auto;
      overflow-y: hidden;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
      padding-bottom: 2px;
    }
    .toolbar::-webkit-scrollbar { display: none; }

    .chip,
    .input,
    .select,
    .toggle,
    .range-wrap {
      flex: 0 0 auto;
      border: 1px solid var(--line);
      background: rgba(8, 12, 18, 0.72);
      color: var(--text);
      border-radius: var(--radius-md);
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.03);
      min-height: 42px;
    }

    .input,
    .select {
      padding: 10px 12px;
      outline: none;
      font-size: 0.95em;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
      min-width: 150px;
    }
    .input { width: 220px; }
    .input:focus,
    .select:focus {
      border-color: rgba(104, 232, 255, 0.60);
      box-shadow: 0 0 0 3px rgba(104, 232, 255, 0.10);
    }

    .chip,
    .btn {
      border: none;
      cursor: pointer;
      user-select: none;
      padding: 10px 12px;
      font-weight: 700;
      font-size: 0.88em;
      white-space: nowrap;
      transition: transform 0.15s ease, filter 0.15s ease, opacity 0.15s ease;
    }
    .chip:hover,
    .btn:hover { transform: translateY(-1px); }
    .chip:active,
    .btn:active { transform: translateY(1px); }

    .btn-add { background: linear-gradient(135deg, var(--accent), #b9f1ff); color: #03121a; }
    .btn-group { background: linear-gradient(135deg, #d2b7ff, #a78bfa); color: #100817; }
    .btn-clear { background: linear-gradient(135deg, #ffd166, #ff956b); color: #1a0f05; }

    .toggle {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      min-width: 136px;
      padding: 10px 12px;
      cursor: pointer;
      user-select: none;
    }
    .toggle span { font-size: 0.88em; line-height: 1.1; }
    .toggle input { display: none; }
    .switch {
      width: 42px;
      height: 24px;
      border-radius: 999px;
      background: rgba(255,255,255,0.12);
      border: 1px solid rgba(255,255,255,0.08);
      position: relative;
      flex: 0 0 auto;
      transition: 0.18s ease;
    }
    .switch::after {
      content: "";
      position: absolute;
      top: 3px;
      left: 3px;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: #e5edf8;
      transition: 0.18s ease;
    }
    .toggle input:checked + .switch {
      background: rgba(53,208,127,0.18);
      border-color: rgba(53,208,127,0.28);
    }
    .toggle input:checked + .switch::after { left: 22px; background: #7ef0a8; }

    .range-wrap {
      display: grid;
      gap: 6px;
      padding: 8px 12px 10px;
      min-width: 160px;
    }
    .range-label {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      color: var(--muted);
      font-size: 0.84em;
      user-select: none;
    }
    .range {
      width: 100%;
      accent-color: var(--accent);
    }

    .content {
      width: min(1040px, calc(100vw - 20px));
      margin: 14px auto 0;
      display: grid;
      gap: 12px;
    }

    .group-shell,
    .ungrouped-shell {
      background: linear-gradient(180deg, rgba(22, 30, 44, 0.50), rgba(12, 18, 28, 0.38));
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 22px;
      box-shadow: var(--shadow);
      overflow: hidden;
      backdrop-filter: blur(16px) saturate(155%);
      -webkit-backdrop-filter: blur(16px) saturate(155%);
    }

    .section-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 12px 12px 10px;
      border-bottom: 1px solid rgba(255,255,255,0.06);
      background: rgba(255,255,255,0.03);
    }

    .section-title {
      margin: 0;
      font-size: 0.92em;
      letter-spacing: 0.03em;
      color: rgba(233, 238, 247, 0.82);
      text-transform: uppercase;
      user-select: none;
    }

    .group-actions {
      display: flex;
      gap: 8px;
      align-items: center;
      flex: 0 0 auto;
    }

    .small-btn {
      border: 1px solid rgba(255,255,255,0.08);
      background: rgba(255,255,255,0.05);
      color: var(--text);
      border-radius: 11px;
      padding: 8px 10px;
      font-size: 0.80em;
      font-weight: 700;
      cursor: pointer;
      user-select: none;
    }
    .small-btn:hover { filter: brightness(1.05); }

    .drop-zone {
      padding: 12px;
    }

    .list {
      margin: 0;
      padding: 0;
      list-style: none;
      display: grid;
      gap: 8px;
      min-height: 24px;
    }

    .done-title {
      margin: 10px 0 8px;
      padding: 0 12px;
      color: rgba(233,238,247,0.72);
      font-size: 0.85em;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      user-select: none;
    }

    .item {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr) auto;
      gap: 10px;
      align-items: center;
      padding: calc(12px * var(--tile-scale)) 12px;
      min-height: calc(56px * var(--tile-scale));
      background: linear-gradient(180deg, rgba(255,255,255,0.08), rgba(255,255,255,0.03));
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 18px;
      overflow: hidden;
      touch-action: none;
      will-change: transform, opacity;
      position: relative;
    }

    .item.dragging {
      opacity: 0.62;
      transform: scale(0.985);
    }

    .item.done .text {
      color: rgba(233, 238, 247, 0.58);
      text-decoration: line-through;
      text-decoration-thickness: 2px;
    }

    .check-wrap {
      width: 22px;
      display: grid;
      place-items: center;
      flex: 0 0 auto;
    }

    .check {
      appearance: none;
      width: 22px;
      height: 22px;
      border-radius: 7px;
      border: 2px solid rgba(120, 139, 166, 0.96);
      background: rgba(7, 10, 15, 0.84);
      display: grid;
      place-items: center;
      cursor: pointer;
      margin: 0;
      transition: 0.15s ease;
    }
    .check::after {
      content: "";
      width: 10px;
      height: 5px;
      border-left: 3px solid transparent;
      border-bottom: 3px solid transparent;
      transform: rotate(-45deg) translateY(-1px);
    }
    .check:checked {
      border-color: rgba(53,208,127,0.95);
      background: rgba(53,208,127,0.16);
      box-shadow: 0 0 0 4px rgba(53,208,127,0.08);
    }
    .check:checked::after {
      border-left-color: var(--success);
      border-bottom-color: var(--success);
    }

    .text {
      min-width: 0;
      line-height: 1.35;
      word-break: break-word;
      user-select: none;
    }

    .drag-handle {
      width: 36px;
      height: 36px;
      display: grid;
      place-items: center;
      border-radius: 12px;
      user-select: none;
      border: 1px solid rgba(255,255,255,0.08);
      background: rgba(255,255,255,0.05);
      color: #d6ddea;
      cursor: grab;
      font-size: 18px;
      line-height: 1;
      touch-action: none;
      flex: 0 0 auto;
    }
    .drag-handle:active { cursor: grabbing; }

    .drop-active {
      outline: 1px dashed rgba(104,232,255,0.50);
      outline-offset: 2px;
      background: rgba(104,232,255,0.06);
    }

    .toast-stack {
      position: fixed;
      left: 16px;
      bottom: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      z-index: 60;
      pointer-events: none;
      max-width: min(92vw, 360px);
    }

    .toast {
      pointer-events: auto;
      background: linear-gradient(180deg, rgba(20,28,42,0.90), rgba(12,18,28,0.88));
      border: 1px solid rgba(255,255,255,0.10);
      color: var(--text);
      border-radius: 999px;
      padding: 11px 14px;
      box-shadow: var(--shadow);
      display: inline-flex;
      align-items: center;
      gap: 10px;
      max-width: 100%;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
      transform: translateX(0);
      opacity: 1;
      transition: transform 0.18s ease, opacity 0.18s ease;
      touch-action: pan-y;
      user-select: none;
    }
    .toast.swiping { transition: none; }
    .toast.fade-out { opacity: 0; transform: translateX(-18px); }
    .toast-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      flex: 0 0 auto;
      background: var(--accent);
      box-shadow: 0 0 0 6px rgba(104,232,255,0.10);
    }

    @media (max-width: 860px) {
      .panel { width: min(100%, calc(100vw - 16px)); }
      .content { width: min(100%, calc(100vw - 16px)); }
      .input { width: 180px; }
    }

    @media (max-width: 560px) {
      .panel { top: 8px; padding: 10px; }
      .input { width: 160px; }
      .toast-stack { left: 12px; bottom: 12px; right: 12px; max-width: calc(100vw - 24px); }
      .item { grid-template-columns: auto minmax(0, 1fr) auto; }
      .drag-handle { width: 34px; height: 34px; }
    }
  </style>
</head>
<body data-font="medium">
  <div class="app">
    <div class="panel">
      <div class="toolbar">
        <input id="itemInput" class="input" type="text" placeholder="Add item" maxlength="120" autocomplete="off" />
        <button id="addBtn" class="chip btn-add" type="button">Add</button>
        <button id="groupBtn" class="chip btn-group" type="button">+ Group</button>
        <button id="clearBtn" class="chip btn-clear" type="button">Clear Checks</button>
        <label class="toggle" title="Move checked items to the bottom with Done heading">
          <span>Group Done</span>
          <input id="groupDone" type="checkbox" />
          <span class="switch"></span>
        </label>
        <select id="fontSelect" class="select" aria-label="Font size">
          <option value="small">Font: Small</option>
          <option value="medium">Font: Medium</option>
          <option value="large">Font: Large</option>
          <option value="xl">Font: Extra Large</option>
        </select>
        <div class="range-wrap">
          <div class="range-label"><span>Tile Height</span><span id="sizeLabel">100%</span></div>
          <input id="sizeSlider" class="range" type="range" min="85" max="140" value="100" />
        </div>
      </div>
    </div>

    <div id="contentRoot" class="content"></div>
  </div>

  <div id="toastStack" class="toast-stack" aria-live="polite" aria-atomic="false"></div>

  <script>
    const STORAGE_KEY = "shopping_list_state_v6";
    const API_BASE_URL = (() => {
      const saved = localStorage.getItem("shopping_api_base");
      if (saved) return saved.replace(/\/$/, "");
      if (location.hostname.endsWith(".vercel.app")) return location.origin;
      return "https://YOUR-VERCEL-DOMAIN.vercel.app";
    })();
    const API_LIST_URL = `${API_BASE_URL}/api/list`;
    const API_SAVE_URL = `${API_BASE_URL}/api/save`;

    const state = {
      items: [],
      groups: [],
      drag: null,
      syncTimer: null,
      fontSize: localStorage.getItem("shopping_font_size") || "medium",
      tileSize: Number(localStorage.getItem("shopping_tile_size") || 100),
      groupDone: localStorage.getItem("shopping_group_done") === "true",
    };

    const contentRoot = document.getElementById("contentRoot");
    const inputEl = document.getElementById("itemInput");
    const addBtn = document.getElementById("addBtn");
    const groupBtn = document.getElementById("groupBtn");
    const clearBtn = document.getElementById("clearBtn");
    const groupDoneEl = document.getElementById("groupDone");
    const fontSelectEl = document.getElementById("fontSelect");
    const sizeSlider = document.getElementById("sizeSlider");
    const sizeLabel = document.getElementById("sizeLabel");
    const toastStack = document.getElementById("toastStack");

    document.body.dataset.font = state.fontSize;
    groupDoneEl.checked = state.groupDone;
    fontSelectEl.value = state.fontSize;
    sizeSlider.value = String(state.tileSize);
    document.documentElement.style.setProperty("--tile-scale", String(state.tileSize / 100));
    sizeLabel.textContent = `${state.tileSize}%`;

    function uid() {
      return crypto?.randomUUID ? crypto.randomUUID() : String(Date.now() + Math.random()).replace(".", "");
    }

    function escapeHtml(str) {
      return String(str)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#39;");
    }

    function showToast(message) {
      const toast = document.createElement("div");
      toast.className = "toast";
      toast.innerHTML = `<span class="toast-dot"></span><span>${escapeHtml(message)}</span>`;
      toastStack.appendChild(toast);

      let startX = 0;
      let currentX = 0;
      let active = false;

      const dismiss = () => {
        if (!toast.isConnected) return;
        toast.classList.add("fade-out");
        setTimeout(() => toast.remove(), 180);
      };

      toast.addEventListener("pointerdown", (e) => {
        active = true;
        startX = e.clientX;
        currentX = startX;
        toast.classList.add("swiping");
        try { toast.setPointerCapture(e.pointerId); } catch (_) {}
      });

      toast.addEventListener("pointermove", (e) => {
        if (!active) return;
        currentX = e.clientX;
        const dx = currentX - startX;
        toast.style.transform = `translateX(${dx}px)`;
        toast.style.opacity = String(Math.max(0.3, 1 - Math.abs(dx) / 200));
      });

      const finish = () => {
        if (!active) return;
        active = false;
        const dx = currentX - startX;
        toast.classList.remove("swiping");
        if (Math.abs(dx) > 70) dismiss();
        else {
          toast.style.transform = "";
          toast.style.opacity = "1";
        }
      };

      toast.addEventListener("pointerup", finish);
      toast.addEventListener("pointercancel", finish);
      toast.addEventListener("pointerleave", finish);
      setTimeout(dismiss, 3000);
    }

    function persistLocal() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify({ items: state.items, groups: state.groups }));
    }

    function setFontSize(size) {
      state.fontSize = size;
      document.body.dataset.font = size;
      localStorage.setItem("shopping_font_size", size);
    }

    function setTileSize(size) {
      state.tileSize = size;
      document.documentElement.style.setProperty("--tile-scale", String(size / 100));
      localStorage.setItem("shopping_tile_size", String(size));
      sizeLabel.textContent = `${size}%`;
    }

    function normalizeItemOrders(groupId) {
      const bucket = state.items.filter(i => (i.groupId || null) === (groupId || null)).sort((a, b) => a.order - b.order);
      bucket.forEach((item, index) => { item.order = index; });
    }

    function normalizeGroupOrders() {
      const ordered = [...state.groups].sort((a, b) => a.order - b.order);
      ordered.forEach((group, index) => { group.order = index; });
    }

    function getOrderedGroups() {
      return [...state.groups].sort((a, b) => a.order - b.order);
    }

    function getOrderedItemsByGroup(groupId) {
      return state.items
        .filter(i => (i.groupId || null) === (groupId || null))
        .sort((a, b) => a.order - b.order);
    }

    function loadLocal() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return false;
        const parsed = JSON.parse(raw);

        if (Array.isArray(parsed)) {
          state.items = parsed.map((item, index) => ({
            id: item.id || uid(),
            text: String(item.text || "").trim(),
            checked: !!item.checked,
            order: Number.isFinite(item.order) ? item.order : index,
            groupId: item.groupId || null,
          })).filter(item => item.text);
          state.groups = [];
        } else if (parsed && typeof parsed === "object") {
          state.items = Array.isArray(parsed.items)
            ? parsed.items.map((item, index) => ({
                id: item.id || uid(),
                text: String(item.text || "").trim(),
                checked: !!item.checked,
                order: Number.isFinite(item.order) ? item.order : index,
                groupId: item.groupId || null,
              })).filter(item => item.text)
            : [];
          state.groups = Array.isArray(parsed.groups)
            ? parsed.groups.map((g, index) => ({
                id: g.id || uid(),
                name: String(g.name || "Group").trim() || "Group",
                order: Number.isFinite(g.order) ? g.order : index,
              }))
            : [];
        }

        normalizeGroupOrders();
        normalizeItemOrders(null);
        state.groups.forEach(g => normalizeItemOrders(g.id));
        persistLocal();
        return true;
      } catch (e) {
        return false;
      }
    }

    async function loadRemote() {
      try {
        const res = await fetch(API_LIST_URL, { cache: "no-store" });
        if (!res.ok) throw new Error("remote load failed");
        const data = await res.json();

        if (Array.isArray(data.items) || Array.isArray(data.groups)) {
          state.items = Array.isArray(data.items)
            ? data.items.map((item, index) => ({
                id: item.id || uid(),
                text: String(item.text || "").trim(),
                checked: !!item.checked,
                order: Number.isFinite(item.order) ? item.order : index,
                groupId: item.groupId || null,
              })).filter(item => item.text)
            : state.items;
          state.groups = Array.isArray(data.groups)
            ? data.groups.map((g, index) => ({
                id: g.id || uid(),
                name: String(g.name || "Group").trim() || "Group",
                order: Number.isFinite(g.order) ? g.order : index,
              }))
            : state.groups;
          normalizeGroupOrders();
          normalizeItemOrders(null);
          state.groups.forEach(g => normalizeItemOrders(g.id));
          persistLocal();
          return true;
        }
      } catch (e) {}
      return false;
    }

    function queueRemoteSave() {
      clearTimeout(state.syncTimer);
      state.syncTimer = setTimeout(syncRemote, 220);
    }

    async function syncRemote() {
      persistLocal();
      try {
        await fetch(API_SAVE_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ items: state.items, groups: state.groups })
        });
      } catch (e) {}
    }

    function saveNow() {
      normalizeGroupOrders();
      normalizeItemOrders(null);
      state.groups.forEach(g => normalizeItemOrders(g.id));
      render();
      queueRemoteSave();
    }

    function addItem(text) {
      const value = text.trim();
      if (!value) return;
      const topOrder = state.items.filter(i => (i.groupId || null) === null).reduce((min, item) => Math.min(min, item.order), 0);
      state.items.push({
        id: uid(),
        text: value,
        checked: false,
        order: topOrder - 1,
        groupId: null,
      });
      saveNow();
      showToast("Item added");
    }

    function addGroup() {
      const name = prompt("Group name:");
      if (!name) return;
      const value = name.trim();
      if (!value) return;
      const nextOrder = state.groups.length ? Math.max(...state.groups.map(g => g.order)) + 1 : 0;
      state.groups.push({ id: uid(), name: value, order: nextOrder });
      saveNow();
      showToast("Group added");
    }

    function deleteGroup(groupId) {
      const group = state.groups.find(g => g.id === groupId);
      if (!group) return;
      if (!confirm(`Delete group \"${group.name}\"? Items will move out.`)) return;
      state.items = state.items.map(item => item.groupId === groupId ? { ...item, groupId: null } : item);
      state.groups = state.groups.filter(g => g.id !== groupId);
      normalizeGroupOrders();
      normalizeItemOrders(null);
      saveNow();
      showToast("Group deleted");
    }

    function toggleItem(id, checked) {
      const item = state.items.find(i => i.id === id);
      if (!item) return;
      item.checked = checked;
      saveNow();
    }

    function clearChecks() {
      if (!state.items.some(i => i.checked)) return;
      if (!confirm("Clear all checks?")) return;
      state.items = state.items.map(i => ({ ...i, checked: false }));
      saveNow();
      showToast("Checks cleared");
    }

    function moveItemToContainer(itemId, targetGroupId, targetIndex) {
      const item = state.items.find(i => i.id === itemId);
      if (!item) return;
      const sourceGroupId = item.groupId || null;
      const remaining = state.items.filter(i => i.id !== itemId);

      const destItems = remaining
        .filter(i => (i.groupId || null) === (targetGroupId || null))
        .sort((a, b) => a.order - b.order);

      const moved = { ...item, groupId: targetGroupId || null };
      const safeIndex = Math.max(0, Math.min(targetIndex, destItems.length));
      destItems.splice(safeIndex, 0, moved);
      destItems.forEach((it, idx) => { it.order = idx; });

      const sourceItems = remaining
        .filter(i => (i.groupId || null) === sourceGroupId)
        .sort((a, b) => a.order - b.order);
      sourceItems.forEach((it, idx) => { it.order = idx; });

      const otherItems = remaining.filter(i => (i.groupId || null) !== sourceGroupId && (i.groupId || null) !== (targetGroupId || null));
      const rebuilt = [...otherItems, ...sourceItems, ...destItems].map((x, idx) => x);

      // Rebuild state without duplicates
      const map = new Map();
      [...remaining, ...destItems].forEach(i => map.set(i.id, i));
      state.items = Array.from(map.values());
      normalizeItemOrders(null);
      state.groups.forEach(g => normalizeItemOrders(g.id));
      saveNow();
    }

    function moveItemBeforeTarget(itemId, targetItemId) {
      const target = state.items.find(i => i.id === targetItemId);
      if (!target) return;
      const targetGroupId = target.groupId || null;
      const targetItems = getOrderedItemsByGroup(targetGroupId).filter(i => i.id !== itemId);
      const moving = state.items.find(i => i.id === itemId);
      if (!moving) return;
      moving.groupId = targetGroupId;
      const targetIndex = targetItems.findIndex(i => i.id === targetItemId);
      targetItems.splice(Math.max(0, targetIndex), 0, moving);
      targetItems.forEach((it, idx) => { it.order = idx; });
      state.items = state.items.map(i => i.id === moving.id ? moving : i);
      normalizeItemOrders(null);
      state.groups.forEach(g => normalizeItemOrders(g.id));
      saveNow();
    }

    function moveItemAfterTarget(itemId, targetItemId) {
      const target = state.items.find(i => i.id === targetItemId);
      if (!target) return;
      const targetGroupId = target.groupId || null;
      const targetItems = getOrderedItemsByGroup(targetGroupId).filter(i => i.id !== itemId);
      const moving = state.items.find(i => i.id === itemId);
      if (!moving) return;
      moving.groupId = targetGroupId;
      const targetIndex = targetItems.findIndex(i => i.id === targetItemId);
      targetItems.splice(Math.max(0, targetIndex + 1), 0, moving);
      targetItems.forEach((it, idx) => { it.order = idx; });
      state.items = state.items.map(i => i.id === moving.id ? moving : i);
      normalizeItemOrders(null);
      state.groups.forEach(g => normalizeItemOrders(g.id));
      saveNow();
    }

    function moveItemToGroupTop(itemId, groupId) {
      const moving = state.items.find(i => i.id === itemId);
      if (!moving) return;
      moving.groupId = groupId;
      const targetItems = getOrderedItemsByGroup(groupId).filter(i => i.id !== itemId);
      targetItems.unshift(moving);
      targetItems.forEach((it, idx) => { it.order = idx; });
      normalizeItemOrders(null);
      state.groups.forEach(g => normalizeItemOrders(g.id));
      saveNow();
    }

    function moveItemToUngroupedTop(itemId) {
      const moving = state.items.find(i => i.id === itemId);
      if (!moving) return;
      moving.groupId = null;
      const targetItems = getOrderedItemsByGroup(null).filter(i => i.id !== itemId);
      targetItems.unshift(moving);
      targetItems.forEach((it, idx) => { it.order = idx; });
      normalizeItemOrders(null);
      state.groups.forEach(g => normalizeItemOrders(g.id));
      saveNow();
    }

    function findDropContext(x, y) {
      const el = document.elementFromPoint(x, y);
      if (!el) return null;
      const item = el.closest?.('.item[data-item-id]');
      if (item) {
        return { type: 'item', id: item.dataset.itemId, el: item };
      }
      const zone = el.closest?.('.drop-zone[data-group-id]');
      if (zone) {
        return { type: 'groupZone', groupId: zone.dataset.groupId || null, el: zone };
      }
      const shell = el.closest?.('.ungrouped-shell');
      if (shell) return { type: 'ungrouped', groupId: null, el: shell };
      return null;
    }

    function renderItem(item) {
      const li = document.createElement("li");
      li.className = "item" + (item.checked ? " done" : "");
      li.dataset.itemId = item.id;
      li.innerHTML = `
        <div class="check-wrap">
          <input type="checkbox" class="check" data-action="toggle" data-id="${item.id}" ${item.checked ? "checked" : ""} />
        </div>
        <div class="text">${escapeHtml(item.text)}</div>
        <div class="drag-handle" data-action="drag" data-id="${item.id}" title="Drag">≡</div>
      `;
      return li;
    }

    function renderSectionForItems(title, items, opts = {}) {
      const shell = document.createElement("div");
      shell.className = opts.groupId ? "group-shell" : "ungrouped-shell";

      if (opts.title) {
        const head = document.createElement("div");
        head.className = "section-head";
        head.innerHTML = `
          <h2 class="section-title">${escapeHtml(opts.title)}</h2>
          <div class="group-actions">${opts.controlsHtml || ""}</div>
        `;
        shell.appendChild(head);
      }

      const zone = document.createElement("div");
      zone.className = "drop-zone";
      zone.dataset.groupId = opts.groupId || "";

      const list = document.createElement("ul");
      list.className = "list";
      list.dataset.sectionGroupId = opts.groupId || "";
      items.forEach(item => list.appendChild(renderItem(item)));
      zone.appendChild(list);

      if (state.groupDone) {
        const done = items.filter(i => i.checked);
        if (done.length) {
          const doneTitle = document.createElement("div");
          doneTitle.className = "done-title";
          doneTitle.textContent = "Done";
          zone.appendChild(doneTitle);
          const doneList = document.createElement("ul");
          doneList.className = "list";
          done.forEach(item => doneList.appendChild(renderItem(item)));
          zone.appendChild(doneList);
        }
      }

      shell.appendChild(zone);
      return shell;
    }

    function render() {
      const scrollY = window.scrollY;
      const root = document.createDocumentFragment();
      const groups = getOrderedGroups();
      const ungrouped = getOrderedItemsByGroup(null);
      const ungroupedVisible = state.groupDone ? ungrouped.filter(i => !i.checked) : ungrouped;

      // Ungrouped first
      const ungroupedShell = document.createElement("div");
      ungroupedShell.className = "ungrouped-shell";
      const ungroupedHead = document.createElement("div");
      ungroupedHead.className = "section-head";
      ungroupedHead.innerHTML = `
        <h2 class="section-title">List</h2>
        <div class="group-actions"></div>
      `;
      ungroupedShell.appendChild(ungroupedHead);

      const ungroupedZone = document.createElement("div");
      ungroupedZone.className = "drop-zone";
      ungroupedZone.dataset.groupId = "";
      const ungroupedList = document.createElement("ul");
      ungroupedList.className = "list";
      ungroupedVisible.forEach(item => ungroupedList.appendChild(renderItem(item)));
      ungroupedZone.appendChild(ungroupedList);

      if (state.groupDone) {
        const doneUngrouped = ungrouped.filter(i => i.checked);
        if (doneUngrouped.length) {
          const doneTitle = document.createElement("div");
          doneTitle.className = "done-title";
          doneTitle.textContent = "Done";
          ungroupedZone.appendChild(doneTitle);
          const doneList = document.createElement("ul");
          doneList.className = "list";
          doneUngrouped.forEach(item => doneList.appendChild(renderItem(item)));
          ungroupedZone.appendChild(doneList);
        }
      }

      ungroupedShell.appendChild(ungroupedZone);
      root.appendChild(ungroupedShell);

      // Groups
      groups.forEach(group => {
        const items = getOrderedItemsByGroup(group.id);
        const visible = state.groupDone ? items.filter(i => !i.checked) : items;
        const shell = document.createElement("div");
        shell.className = "group-shell";
        shell.dataset.groupId = group.id;

        const head = document.createElement("div");
        head.className = "section-head";
        head.innerHTML = `
          <h2 class="section-title">${escapeHtml(group.name)}</h2>
          <div class="group-actions">
            <button class="small-btn" data-action="delete-group" data-group-id="${group.id}">Delete</button>
          </div>
        `;
        shell.appendChild(head);

        const zone = document.createElement("div");
        zone.className = "drop-zone";
        zone.dataset.groupId = group.id;
        const list = document.createElement("ul");
        list.className = "list";
        visible.forEach(item => list.appendChild(renderItem(item)));
        zone.appendChild(list);

        if (state.groupDone) {
          const done = items.filter(i => i.checked);
          if (done.length) {
            const doneTitle = document.createElement("div");
            doneTitle.className = "done-title";
            doneTitle.textContent = "Done";
            zone.appendChild(doneTitle);
            const doneList = document.createElement("ul");
            doneList.className = "list";
            done.forEach(item => doneList.appendChild(renderItem(item)));
            zone.appendChild(doneList);
          }
        }

        shell.appendChild(zone);
        root.appendChild(shell);
      });

      contentRoot.replaceChildren(root);
      requestAnimationFrame(() => window.scrollTo({ top: scrollY, left: 0, behavior: "auto" }));
    }

    function handleItemDrop(sourceId, clientX, clientY) {
      const target = findDropContext(clientX, clientY);
      if (!target) {
        moveItemToUngroupedTop(sourceId);
        return;
      }

      if (target.type === 'item') {
        const targetEl = target.el;
        const rect = targetEl.getBoundingClientRect();
        const before = clientY < rect.top + rect.height / 2;
        if (target.id === sourceId) return;
        if (before) moveItemBeforeTarget(sourceId, target.id);
        else moveItemAfterTarget(sourceId, target.id);
        return;
      }

      if (target.type === 'groupZone') {
        moveItemToGroupTop(sourceId, target.groupId || null);
        return;
      }

      if (target.type === 'ungrouped') {
        moveItemToUngroupedTop(sourceId);
      }
    }

    document.addEventListener("change", (e) => {
      const t = e.target;
      if (t.matches('input[type="checkbox"][data-action="toggle"]')) {
        toggleItem(t.dataset.id, t.checked);
      }
    });

    document.addEventListener("click", (e) => {
      const action = e.target.closest("[data-action]");
      if (!action) return;
      const kind = action.dataset.action;
      if (kind === "delete-group") {
        deleteGroup(action.dataset.groupId);
      }
    });

    document.addEventListener("pointerdown", (e) => {
      const handle = e.target.closest('.drag-handle[data-action="drag"]');
      if (!handle) return;
      const itemId = handle.dataset.id;
      const item = state.items.find(i => i.id === itemId);
      if (!item) return;
      const itemEl = handle.closest('.item');
      if (!itemEl) return;
      state.drag = {
        id: itemId,
        pointerId: e.pointerId,
        startX: e.clientX,
        startY: e.clientY,
        currentX: e.clientX,
        currentY: e.clientY,
        el: itemEl,
        active: true
      };
      itemEl.classList.add("dragging");
      try { handle.setPointerCapture(e.pointerId); } catch (_) {}
    });

    document.addEventListener("pointermove", (e) => {
      if (!state.drag || !state.drag.active || e.pointerId !== state.drag.pointerId) return;
      state.drag.currentX = e.clientX;
      state.drag.currentY = e.clientY;
    });

    function endDrag(e) {
      if (!state.drag || e.pointerId !== state.drag.pointerId) return;
      const { id, el, currentX, currentY } = state.drag;
      el.classList.remove("dragging");
      handleItemDrop(id, currentX, currentY);
      state.drag = null;
      clearDropHighlights();
    }

    document.addEventListener("pointerup", endDrag);
    document.addEventListener("pointercancel", endDrag);

    function clearDropHighlights() {
      document.querySelectorAll(".drop-active").forEach(el => el.classList.remove("drop-active"));
    }

    document.addEventListener("pointermove", (e) => {
      if (!state.drag) return;
      clearDropHighlights();
      const target = findDropContext(e.clientX, e.clientY);
      if (target && target.el) target.el.classList.add("drop-active");
    });

    addBtn.addEventListener("click", () => {
      addItem(inputEl.value);
      inputEl.value = "";
      inputEl.focus({ preventScroll: true });
    });

    groupBtn.addEventListener("click", addGroup);
    clearBtn.addEventListener("click", clearChecks);

    groupDoneEl.addEventListener("change", () => {
      state.groupDone = groupDoneEl.checked;
      localStorage.setItem("shopping_group_done", String(state.groupDone));
      render();
      showToast(state.groupDone ? "Done grouping on" : "Done grouping off");
    });

    fontSelectEl.addEventListener("change", () => {
      setFontSize(fontSelectEl.value);
      showToast("Font updated");
    });

    sizeSlider.addEventListener("input", () => {
      setTileSize(Number(sizeSlider.value));
    });

    async function init() {
      const localLoaded = loadLocal();
      if (!localLoaded) {
        state.items = [];
        state.groups = [];
      }
      render();
      if (navigator.onLine !== false) {
        const remoteLoaded = await loadRemote();
        if (remoteLoaded) render();
      }
    }

    window.addEventListener("beforeunload", persistLocal);
    window.addEventListener("online", () => loadRemote().then(ok => { if (ok) render(); }));
    init();
  </script>
</body>
</html>
